<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 会话管理器</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --fg:#e6e9ef; --muted:#98a1b3; --accent:#4f8cff; --accent2:#2f6fe4;
    --warn:#f0a020; --danger:#e5484d; --ok:#30a46c; --ghost:#a86bd6;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.55 "Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif}
  a{color:var(--accent)}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;
    background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  header h1{font-size:17px;margin:0;font-weight:600;white-space:nowrap}
  .badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--panel2);
    color:var(--muted);border:1px solid var(--line);white-space:nowrap}
  .badge.ok{color:var(--ok);border-color:#1f5c3d}
  .badge.warn{color:var(--warn);border-color:#5c4620}
  nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  nav button{background:transparent;border:1px solid transparent;color:var(--muted);
    padding:7px 13px;border-radius:7px;cursor:pointer;font-size:13px}
  nav button:hover{background:var(--panel2);color:var(--fg)}
  nav button.active{background:var(--accent);color:#fff}
  main{padding:20px;max-width:1500px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:15px}
  .card h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
  .card .path{color:var(--muted);font-size:12px;font-family:ui-monospace,Consolas,monospace;
    word-break:break-all;margin:6px 0}
  .stat{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
  .stat div{font-size:12px;color:var(--muted)}
  .stat b{display:block;font-size:17px;color:var(--fg);font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);
    vertical-align:middle}
  th{color:var(--muted);font-weight:500;font-size:12px}
  tbody tr:hover{background:var(--panel2)}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
  .title{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);
    color:var(--muted);margin-right:4px;display:inline-block}
  .tag.ghost{color:var(--ghost);border-color:#4a2d63}
  .tag.orphan{color:var(--warn);border-color:#5c4620}
  .tag.locked{color:var(--danger);border-color:#5c2326}
  button.act{background:var(--accent);border:none;color:#fff;padding:6px 12px;
    border-radius:6px;cursor:pointer;font-size:12px}
  button.act:hover{background:var(--accent2)}
  button.act.ghostbtn{background:transparent;border:1px solid var(--line);color:var(--muted)}
  button.act.ghostbtn:hover{color:var(--fg);border-color:var(--muted)}
  button.act:disabled{opacity:.4;cursor:not-allowed}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  input[type=search],select{background:var(--panel);border:1px solid var(--line);
    color:var(--fg);padding:7px 11px;border-radius:7px;font-size:13px}
  input[type=search]{min-width:230px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;
    align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal.show{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    max-width:820px;width:100%;max-height:86vh;overflow:auto;padding:20px}
  .modal h2{margin:0 0 4px;font-size:17px}
  .modal .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
  .actions-list{background:var(--bg);border:1px solid var(--line);border-radius:8px;
    max-height:300px;overflow:auto;margin:12px 0}
  .actions-list div{padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;
    display:flex;gap:10px;align-items:flex-start}
  .actions-list div:last-child{border-bottom:none}
  .actions-list .k{color:var(--accent);font-family:ui-monospace,monospace;
    flex-shrink:0;min-width:112px}
  .warnbox{background:#241c0d;border:1px solid #5c4620;color:#f0c070;padding:10px 12px;
    border-radius:8px;font-size:12.5px;margin:10px 0}
  .errbox{background:#2a1416;border:1px solid #5c2326;color:#f08a8e;padding:10px 12px;
    border-radius:8px;font-size:12.5px;margin:10px 0}
  .okbox{background:#0f2419;border:1px solid #1f5c3d;color:#7fd8a8;padding:10px 12px;
    border-radius:8px;font-size:12.5px;margin:10px 0}
  .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  label.chk{display:flex;gap:8px;align-items:center;font-size:12.5px;
    color:var(--muted);margin:8px 0;cursor:pointer}
  .empty{color:var(--muted);text-align:center;padding:40px}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;
    vertical-align:-2px}
  @keyframes s{to{transform:rotate(360deg)}}
  .finding{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--muted);
    border-radius:8px;padding:12px 14px;margin-bottom:10px}
  .finding.warn{border-left-color:var(--warn)}
  .finding b{font-size:13.5px}
  .finding p{color:var(--muted);font-size:12.5px;margin:4px 0}
  code{background:var(--bg);padding:2px 6px;border-radius:5px;
    font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}

  /* ---- value tiers ---- */
  .tier{display:inline-block;min-width:58px;padding:1px 6px;border-radius:5px;
    font-size:11px;text-align:center;border:1px solid var(--line);cursor:help}
  .tier.high{color:#7fd8a8;border-color:#1f5c3d;background:#0f2419}
  .tier.medium{color:#8ab4ff;border-color:#2b4a7d;background:#16213a}
  .tier.low{color:#f0c070;border-color:#5c4620;background:#241c0d}
  .tier.junk{color:#f08a8e;border-color:#5c2326;background:#2a1416}
  .tier.unknown{color:var(--muted);background:var(--panel2)}

  /* ---- conversation preview ---- */
  .clickable{cursor:pointer}
  .clickable:hover{color:var(--accent);text-decoration:underline}
  .pv-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);
    background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px}
  .pv-meta b{color:var(--fg);font-weight:600}
  .pv-list{display:flex;flex-direction:column;gap:9px;max-height:56vh;overflow:auto;
    padding-right:6px}
  .pv-msg{border:1px solid var(--line);border-radius:9px;padding:10px 12px;
    background:var(--bg)}
  .pv-msg .head{display:flex;align-items:center;gap:8px;margin-bottom:6px;
    font-size:11.5px;color:var(--muted)}
  .pv-msg .who{font-weight:600;font-size:12px;padding:1px 8px;border-radius:99px;
    border:1px solid var(--line)}
  .pv-msg.user .who{color:#8ab4ff;border-color:#2b4a7d;background:#16213a}
  .pv-msg.assistant .who{color:#7fd8a8;border-color:#1f5c3d;background:#0f2419}
  .pv-msg.tool .who{color:#f0c070;border-color:#5c4620;background:#241c0d}
  .pv-msg.system .who{color:var(--muted)}
  .pv-msg .kind{font-size:10.5px;padding:1px 6px;border-radius:5px;
    border:1px solid var(--line);color:var(--muted)}
  .pv-msg.err{border-color:#5c2326}
  .pv-msg .body{white-space:pre-wrap;word-break:break-word;font-size:12.5px;
    font-family:ui-monospace,Consolas,"Microsoft YaHei",monospace;line-height:1.5}
  .pv-msg.reasoning .body{color:#b9a6d9;font-style:italic}
  .pv-msg.tool .body{color:#cbb98d}
  .pv-sect{font-size:11.5px;color:var(--muted);margin:2px 0 6px}
</style>
</head>
<body>

<header>
  <h1>Agent 会话管理器</h1>
  <span class="badge" id="envBadge">加载中…</span>
  <nav>
    <button data-view="overview" class="active">总览</button>
    <button data-view="sessions">会话</button>
    <button data-view="search">内容搜索</button>
    <button data-view="usage">用量</button>
    <button data-view="cleanup">清理建议</button>
    <button data-view="uninstall">卸载清理</button>
    <button data-view="history">操作记录</button>
  </nav>
</header>

<main>
  <section id="view-overview"></section>
  <section id="view-sessions" style="display:none"></section>
  <section id="view-search" style="display:none"></section>
  <section id="view-usage" style="display:none"></section>
  <section id="view-cleanup" style="display:none"></section>
  <section id="view-uninstall" style="display:none"></section>
  <section id="view-history" style="display:none"></section>
</main>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hsize = n => {
  if(!n) return "0 B";
  const u=["B","KB","MB","GB","TB"]; let i=0;
  while(n>=1024 && i<u.length-1){n/=1024;i++;}
  return (i? n.toFixed(1): n) + " " + u[i];
};
const api = async (p, opt) => {
  const r = await fetch(p, opt);
  let j; try { j = await r.json(); } catch(e) { throw new Error("响应不是 JSON"); }
  return j;
};
function modal(html){ $("#modalBox").innerHTML = html; $("#modal").classList.add("show"); }
function closeModal(){ $("#modal").classList.remove("show"); }
$("#modal").addEventListener("click", e => { if(e.target.id==="modal") closeModal(); });
document.addEventListener("keydown", e => { if(e.key==="Escape") closeModal(); });

let STATE = { report:null, sessions:[], scores:null, view:"overview" };

/* ------------------------------------------------------------------ views */
document.querySelectorAll("nav button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    STATE.view = b.dataset.view;
    ["overview","sessions","search","usage","cleanup","uninstall","history"].forEach(v => {
      $("#view-"+v).style.display = (v===STATE.view) ? "" : "none";
    });
    if(STATE.view==="sessions") renderSessions();
    if(STATE.view==="search") renderSearch();
    if(STATE.view==="usage") renderUsage();
    if(STATE.view==="cleanup") renderCleanup();
    if(STATE.view==="uninstall") renderUninstall();
    if(STATE.view==="history") renderHistory();
  };
});

/* --------------------------------------------------------------- overview */
async function loadOverview(){
  $("#view-overview").innerHTML = `<div class="empty"><span class="spin"></span> 正在扫描本机 Agent…</div>`;
  const r = await api("/api/report");
  if(!r.ok){ $("#view-overview").innerHTML = `<div class="errbox">${esc(r.error)}</div>`; return; }
  STATE.report = r;

  $("#envBadge").textContent = `检测到 ${r.detected_count}/${r.total_supported} 个 Agent`;
  $("#envBadge").className = "badge ok";

  let h = `<div class="grid">`;
  for(const a of r.agents){
    const installed = a.installed;
    h += `<div class="card">
      <h3>${esc(a.label)}
        <span class="badge ${installed?'ok':''}">${installed?'已安装':'未检测到'}</span>
        ${a.running.length?`<span class="badge warn">运行中</span>`:''}
      </h3>
      <div class="path">${esc(a.storage_hint)}</div>
      <div class="stat">
        <div><b>${a.session_count ?? 0}</b>会话</div>
        <div><b>${hsize(a.size)}</b>占用空间</div>
        <div><b>${a.file_count.toLocaleString()}</b>文件</div>
      </div>
      ${installed?`<div style="margin-top:12px">
        <button class="act ghostbtn" onclick="showSessionsFor('${esc(a.id)}')">查看会话</button>
      </div>`:`<div class="path" style="margin-top:10px">未在本机发现该 Agent 的数据目录。</div>`}
    </div>`;
  }
  h += `</div>`;

  if(r.unsupported_programs.length){
    h += `<h3 style="margin-top:26px">检测到但尚未支持的程序</h3>
      <div class="card"><table><thead><tr><th>名称</th><th>版本</th><th>位置</th></tr></thead><tbody>`;
    for(const p of r.unsupported_programs){
      h += `<tr><td>${esc(p.name)}</td><td class="mono">${esc(p.version||'')}</td>
        <td class="path" style="margin:0">${esc(p.location||'')}</td></tr>`;
    }
    h += `</tbody></table>
      <p class="path" style="margin-top:10px">这些程序看起来是 AI Agent，但本工具还没有为它们写适配器，因此不会被扫描或修改。</p>
      </div>`;
  }

  const recl = (await api("/api/reclaimable")).items || [];
  if(recl.length){
    h += `<h3 style="margin-top:26px">可回收空间（仅建议，不会自动删除）</h3><div class="card"><table>
      <thead><tr><th>项目</th><th class="num">大小</th><th>位置</th></tr></thead><tbody>`;
    for(const it of recl){
      h += `<tr><td>${esc(it.label)}<div class="path" style="margin:2px 0 0">${esc(it.why)}</div></td>
        <td class="num">${hsize(it.size)}</td>
        <td class="mono" style="word-break:break-all">${esc(it.path)}</td></tr>`;
    }
    h += `</tbody></table></div>`;
  }
  $("#view-overview").innerHTML = h;
}

window.showSessionsFor = (agent) => {
  document.querySelector('nav button[data-view="sessions"]').click();
  const af = $("#agentFilter");
  if(af) af.value = agent;
  renderSessions();
};

/* --------------------------------------------------------------- sessions */
async function loadSessions(){
  const r = await api("/api/sessions");
  STATE.sessions = r.sessions || [];
}

async function renderSessions(){
  if(!STATE.sessions.length) await loadSessions();
  // Value scores load separately: slower to compute, and a failure must not
  // break the session table itself.
  if(!STATE.scores){
    api("/api/scores").then(r => {
      if(r && r.ok){
        const map = {};
        for(const s of (r.sessions||[])) map[`${s.agent}|${s.sid}`] = s.score;
        STATE.scores = map;
        STATE.scoreTiers = r.tiers || [];
        if(STATE.view==="sessions") renderSessions();
      }
    }).catch(()=>{});
  }
  if(STATE.scores){
    for(const s of STATE.sessions){
      s.score = STATE.scores[`${s.agent}|${s.sid}`] || null;
    }
  }
  const agents = [...new Set(STATE.sessions.map(s=>s.agent))].sort();

  $("#view-sessions").innerHTML = `
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索标题、路径、会话 ID…">
      <select id="agentFilter">
        <option value="">全部 Agent</option>
        ${agents.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("")}
      </select>
      <select id="sortBy">
        <option value="size">按体积排序</option>
        <option value="time">按时间排序</option>
        <option value="title">按标题排序</option>
        <option value="score">按价值排序</option>
      </select>
      <label class="chk"><input type="checkbox" id="onlyResidue"> 只看残留（幽灵/孤儿）</label>
      <span class="badge" id="cnt"></span>
      <button class="act ghostbtn" onclick="refreshAll()">重新扫描</button>
    </div>
    <div class="toolbar" id="batchBar" style="display:none">
      <span class="badge warn" id="pickCnt"></span>
      <button class="act" onclick="batchDelete()">删除选中项…</button>
      <button class="act ghostbtn" onclick="clearPicks()">取消选择</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <table>
        <thead><tr>
          <th style="width:34px"><input type="checkbox" id="pickAll" title="全选"></th>
          <th>Agent</th><th>标题</th><th>会话 ID</th>
          <th class="num" title="按本机可见的内容与用量估算；「无法评估」表示正文不在此机器，请勿仅凭分数删除">价值</th>
          <th class="num">体积</th><th>最后活动</th><th style="width:250px"></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>`;

  const apply = () => {
    const q = $("#q").value.trim().toLowerCase();
    const af = $("#agentFilter").value;
    const onlyRes = $("#onlyResidue").checked;
    const sort = $("#sortBy").value;
    let list = STATE.sessions.filter(s=>{
      if(af && s.agent!==af) return false;
      if(onlyRes && !(s.is_ghost||s.is_orphan)) return false;
      if(q){
        const hay = [s.title,s.cwd,s.sid,s.agent_label,...(s.paths||[])].join(" ").toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    });
    list.sort((a,b)=>{
      if(sort==="size") return (b.size||0)-(a.size||0);
      if(sort==="time") return (b.updated_at||0)-(a.updated_at||0);
      if(sort==="score") return ((a.score&&a.score.score)||0)-((b.score&&b.score.score)||0);
      return String(a.title).localeCompare(String(b.title));
    });
    $("#cnt").textContent = `${list.length} 个会话 · ${hsize(list.reduce((n,s)=>n+(s.size||0),0))}`;
    $("#rows").innerHTML = list.length ? list.map(rowHtml).join("")
      : `<tr><td colspan="8" class="empty">没有匹配的会话</td></tr>`;
  };

  ["#q","#agentFilter","#sortBy","#onlyResidue"].forEach(sel=>{
    const el=$(sel); if(el){ el.oninput=apply; el.onchange=apply; }
  });
  $("#pickAll").onchange = (e) => {
    document.querySelectorAll(".pick").forEach(c => { c.checked = e.target.checked; });
    updatePickBar();
  };
  document.querySelector("#rows").addEventListener("change", e => {
    if(e.target.classList.contains("pick")) updatePickBar();
  });
  apply();
  updatePickBar();
}

/* Value tier badge. The score is advisory: "无法评估" means the body is not on
   this machine, NOT that the session is worthless. */
function tierCell(s){
  const q = s.score;
  if(!q || q.score == null) return `<span class="tier unknown" title="尚未评分">—</span>`;
  const tip = `${q.tier_label}（${q.score}/100）\n${q.tier_why}`;
  return `<span class="tier ${esc(q.tier)}" title="${esc(tip)}">${esc(q.tier_label)}</span>`;
}

function rowHtml(s){
  const tags=[];
  if(s.pinned) tags.push(`<span class="tag" style="color:var(--warn);border-color:#5c4620"
      title="${esc(s.pin_reason||'已标记保留，删除会被拒绝')}">保留</span>`);
  else if(s.workspace_protected) tags.push(`<span class="tag" style="color:var(--warn);border-color:#5c4620"
      title="所在工作区 ${esc(s.workspace_pin_path||'')} 已标记保留${s.workspace_pin_reason?'：'+esc(s.workspace_pin_reason):''}">工作区保留</span>`);
  if(s.is_ghost) tags.push(`<span class="tag ghost" title="只有索引，没有正文">幽灵</span>`);
  if(s.is_orphan) tags.push(`<span class="tag orphan" title="不在任何工作区列表里">孤儿</span>`);
  if(!s.deletable) tags.push(`<span class="tag locked">不可删</span>`);
  for(const t of (s.tags||[])) tags.push(`<span class="tag">${esc(t)}</span>`);
  const a = esc(s.agent), id = esc(s.sid);
  const lockTitle = s.pinned ? '取消会话保留标记'
                  : s.workspace_protected ? '所在工作区已保留，点击可取消工作区保留'
                  : '标记为保留（防止误删）';
  const lockLabel = s.pinned ? '取消保留'
                  : s.workspace_protected ? '取消工作区保留'
                  : '保留';
  const ea = esc(a), eid = esc(id);
  return `<tr>
    <td><input type="checkbox" class="pick" data-agent="${ea}" data-sid="${eid}"></td>
    <td class="mono">${esc(s.agent)}</td>
    <td><div class="title clickable" title="点击预览会话内容：${esc(s.title)}"
          onclick="previewSession('${ea}','${eid}')">${esc(s.title)}</div>
        ${tags.join("")}${s.note?`<div class="path" style="margin:2px 0 0">${esc(s.note)}</div>`:''}</td>
    <td class="mono" style="font-size:11px">${esc(s.sid)}</td>
    <td class="num">${tierCell(s)}</td>
    <td class="num">${hsize(s.size)}</td>
    <td class="mono" style="font-size:11.5px">${esc(s.updated_iso||'')}</td>
    <td style="white-space:nowrap">
      <button class="act ghostbtn" onclick="previewSession('${ea}','${eid}')">查看</button>
      <button class="act ghostbtn" title="${esc(lockTitle)}"
        onclick="togglePin('${ea}','${eid}')">${esc(lockLabel)}</button>
      <button class="act ghostbtn" title="导出会话内容到文件"
        onclick="exportSession('${ea}','${eid}')">导出</button>
      <button class="act" onclick="planDelete('${ea}','${eid}')">删除…</button>
    </td>
  </tr>`;
}

/* ------------------------------------------------------------ keep / pin */
window.togglePin = async (agent, sid) => {
  const s = (STATE.sessions||[]).find(x => x.agent===agent && x.sid===sid);
  const isPinned = !!(s && s.pinned);
  const isWsProtected = !!(s && s.workspace_protected);

  // Workspace protection: lifting it affects the whole folder.
  if(!isPinned && isWsProtected){
    const wsPath = (s && s.workspace_pin_path) || "";
    if(!confirm(`该会话受工作区保留保护：\n${wsPath}\n\n`
      + `其下所有会话（含将来新增的）都受保护。\n\n`
      + `确定要取消该工作区的保留标记吗？（只影响这一个文件夹）`)) return;
    try {
      const r = await api("/api/workspace-pin", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({agent, path: wsPath, unpin: true})
      });
      if(!r.ok) throw new Error(r.error || "操作失败");
      await refreshAfterState();
    } catch(e){ alert("操作失败：" + e.message); }
    return;
  }

  let reason = "";
  if(!isPinned){
    reason = prompt("标记为「保留」后，删除该会话会被拒绝。可填写备注（可留空）：", "") ?? null;
    if(reason === null) return;
  }
  try {
    const r = await api("/api/pin", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({agent, sid, unpin: isPinned, reason})
    });
    if(!r.ok) throw new Error(r.error || "操作失败");
    await refreshAfterState();
  } catch(e){ alert("操作失败：" + e.message); }
};

async function refreshAfterState(){
  delete STATE.scores;
  await loadSessions();
  if(STATE.view==="sessions") renderSessions();
  if(STATE.view==="search") runSearch();
  if(STATE.view==="cleanup") renderCleanup();
}

const ROLE_LABEL = {user:"用户", assistant:"助手", tool:"工具", system:"系统"};
const KIND_LABEL = {
  text:"", reasoning:"思考", "tool-call":"调用", "tool-result":"结果",
  image:"图片", note:""
};

window.previewSession = async (agent, sid) => {

  } catch(e) {

  }

      <div class="row"><button class="act ghostbtn" onclick="closeModal()">关闭</button></div>`);

function renderPreview(agent, sid, r){
  const s = r.session || {};
  const msgs = r.messages || [];
  const n = r.total_messages || msgs.length;

  let h = `<h2>${esc(r.title || s.title || '(无标题)')}</h2>
    <div class="sub">${esc(s.agent_label || agent)} ·
      <span class="mono">${esc(sid)}</span></div>`;

  const facts = [];
  if(s.cwd) facts.push(`<span>工作目录 <b>${esc(s.cwd)}</b></span>`);
  if(s.size_h) facts.push(`<span>占用 <b>${esc(s.size_h)}</b></span>`);
  if(s.updated_iso) facts.push(`<span>最后活动 <b>${esc(s.updated_iso)}</b></span>`);
  facts.push(`<span>消息 <b>${n}</b> 条</span>`);
  if(s.is_ghost) facts.push(`<span class="tag ghost">幽灵</span>`);
  if(s.is_orphan) facts.push(`<span class="tag orphan">孤儿</span>`);
  if(s.pinned) facts.push(`<span class="tag" style="color:var(--warn)">保留</span>`);
  h += `<div class="pv-meta">${facts.join('')}</div>`;

  if(r.reason){
    h += `<div class="warnbox">${esc(r.reason)}</div>`;
  }
  if(r.truncated){
    h += `<div class="warnbox">会话消息较多，仅显示前 ${msgs.length} 条（共 ${n} 条）。</div>`;
  }

  if(msgs.length){
    h += `<div class="pv-list">`;
    msgs.forEach(m => {
      const role = m.role || 'assistant';
      const kind = KIND_LABEL[m.kind] ?? m.kind ?? '';
      const cls = ['pv-msg', role, m.kind === 'reasoning' ? 'reasoning' : '',
                   m.is_error ? 'err' : ''].filter(Boolean).join(' ');
      h += `<div class="${cls}">
        <div class="head">
          <span class="who">${esc(ROLE_LABEL[role] || role)}</span>
          ${kind?`<span class="kind">${esc(kind)}</span>`:''}
          ${m.tool?`<span class="kind">${esc(m.tool)}</span>`:''}
          ${m.is_error?`<span class="kind" style="color:var(--danger);border-color:#5c2326">出错</span>`:''}
          <span style="margin-left:auto">${esc(m.time_iso||'')}</span>
        </div>
        <div class="body">${esc(m.text)}</div>
      </div>`;
    });
    h += `</div>`;
  } else {
    h += `<div class="empty">没有可显示的消息内容。</div>`;
  }

  const extra = r.extra || {};
  if(Object.keys(extra).length){
    const pretty = JSON.stringify(extra, null, 2);
    h += `<details style="margin-top:14px">
      <summary style="cursor:pointer;color:var(--muted);font-size:12.5px">
        技术细节（存储位置、字段等）</summary>
      <pre style="background:var(--bg);border:1px solid var(--line);border-radius:8px;
        padding:10px;margin-top:8px;max-height:220px;overflow:auto;font-size:11.5px;
        color:var(--muted);white-space:pre-wrap;word-break:break-all">${esc(pretty)}</pre>
    </details>`;
  }

  h += `<div class="row">
    <button class="act ghostbtn" onclick="closeModal()">关闭</button>
    <button class="act ghostbtn" onclick="closeModal();exportSession('${esc(agent)}','${esc(sid)}')">
      导出…</button>
    <button class="act" onclick="closeModal();planDelete('${esc(agent)}','${esc(sid)}')">
      删除这个会话…</button>
  </div>`;

  modal(h);
}

/* --------------------------------------------------------------- delete */
window.planDelete = async (agent, sid) => {
  modal(`<h2>正在生成删除计划…</h2><div class="sub">只读取，不做任何修改</div>
    <div class="empty"><span class="spin"></span></div>`);
  let r;
  try { r = await api(`/api/plan?agent=${encodeURIComponent(agent)}&sid=${encodeURIComponent(sid)}`); }
  catch(e){ return modal(`<h2>出错</h2><div class="errbox">${esc(e.message)}</div>
    <div class="row"><button class="act ghostbtn" onclick="closeModal()">关闭</button></div>`); }

  if(!r.ok){
    return modal(`<h2>无法删除该会话</h2><div class="errbox">${esc(r.error)}${r.detail?`<br><br>${esc(r.detail)}`:''}</div>
      <div class="row"><button class="act ghostbtn" onclick="closeModal()">关闭</button></div>`);
  }
  const p = r.plan;
  const blocked = p.blocked || !p.can_execute;

  let h = `<h2>${esc(p.title || '(无标题)')}</h2>
    <div class="sub">${esc(p.agent_label)} · <span class="mono">${esc(p.sid)}</span></div>`;

  if(p.pinned || p.workspace_protected){
    h += `<div class="warnbox"><b>该会话已被保护，删除会被拒绝</b><br>
      ${p.pinned
        ? '已标记「保留」。'
        : `所在工作区 <code>${esc(p.workspace_pin_path||'')}</code> 已标记「保留」，
           其下所有会话（含将来新增的）都受保护。`}
      如需删除，请先取消保留标记，
      或勾选下面的「忽略保留标记」。</div>`;
  }
  if(blocked){
    h += `<div class="errbox"><b>已阻止删除</b><br>${esc(p.block_reason || (p.validation_problems||[]).join('；'))}</div>`;
  }
  for(const w of (p.warnings||[])) h += `<div class="warnbox">${esc(w)}</div>`;

  h += `<div style="margin:14px 0 6px;font-size:13px">将执行 <b>${p.action_count}</b> 项操作：
    ${p.total_size_h?`预计释放 <b>${esc(p.total_size_h)}</b>`:''}</div>
    <div class="actions-list">`;
  for(const a of p.actions){
    h += `<div><span class="k">${esc(a.kind)}</span>
      <span>${esc(a.detail||'')}<br><code>${esc(a.path)}</code>
      ${a.reversible?'':`<span class="tag locked">不可还原</span>`}</span></div>`;
  }
  h += `</div>`;

  if((p.optional_actions||[]).length){
    h += `<div class="warnbox"><b>可选：${p.optional_actions.length} 个无引用附件</b><br>
      这些是内容寻址的附件，删除后不再被任何剩余会话引用。
      默认<b>不</b>删除，因为判断基于文本匹配，属于保守策略。</div>
      <label class="chk"><input type="checkbox" id="optAtt"> 同时删除这些附件</label>`;
  }

  h += `<label class="chk"><input type="checkbox" id="perm">
      永久删除（<b>不进隔离区，无法还原</b>）</label>`;
  if(p.pinned || p.workspace_protected){
    h += `<label class="chk"><input type="checkbox" id="ignorePin">
        忽略保留标记（<b>仅本次</b>，不会取消标记）</label>`;
  }

  h += `<div class="okbox">默认行为：数据会移动到隔离区
    <code>_data/quarantine/</code>，可在「操作记录」中一键还原。
    <br>确认前若会话内容发生变化，删除会被自动取消，需要重新确认。</div>`;

  h += `<div class="row">
    <button class="act ghostbtn" onclick="closeModal()">取消</button>
    <button class="act" id="confirmBtn" ${blocked?'disabled':''}
      onclick="doDeleteFromModal()">确认删除</button>
  </div>`;

  // The fingerprint is carried in a hidden input rather than interpolated into
  // the onclick attribute: a 64-char hex string is quoted JSON, and embedding it
  // in a double-quoted HTML attribute breaks the attribute boundary — which made
  // the confirm button silently do nothing.
  h += `<input type="hidden" id="fpAgent" value="${esc(p.agent)}">
        <input type="hidden" id="fpSid" value="${esc(p.sid)}">
        <input type="hidden" id="fpInput" value="${esc(p.fingerprint||'')}">`;

  modal(h);
};

window.doDeleteFromModal = () => {
  const agent = $("#fpAgent")?.value || "";
  const sid = $("#fpSid")?.value || "";
  const fp = $("#fpInput")?.value || "";
  return doDelete(agent, sid, fp);
};

window.doDelete = async (agent, sid, fingerprint) => {
  const btn = $("#confirmBtn");
  const perm = $("#perm")?.checked || false;
  const att = $("#optAtt")?.checked || false;
  const ignorePin = $("#ignorePin")?.checked || false;
  if(perm && !confirm("永久删除无法还原，确定继续？")) return;
  btn.disabled = true;
  btn.innerHTML = `<span class="spin"></span> 正在删除…`;
  let r;
  try {
    r = await api("/api/delete", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({agent, sid, permanent:perm, include_attachments:att,
                            allow_unpin:ignorePin, fingerprint: fingerprint||""})
    });
  } catch(e){ r = {ok:false, error:e.message}; }

  if(!r.ok){
    const stale = (r.detail||"").includes("指纹") || (r.detail||"").includes("发生了变化");
    modal(`<h2>${stale?'内容已变化，删除已取消':'删除失败'}</h2>
      <div class="errbox">${esc(r.error||'')}<br><br>${esc(r.detail||'')}</div>
      <div class="row">
        <button class="act ghostbtn" onclick="closeModal()">关闭</button>
        ${stale?`<button class="act" onclick="closeModal();planDelete('${esc(agent)}','${esc(sid)}')">
          重新查看计划</button>`:''}
      </div>`);
  } else {
    modal(`<h2>已删除并校验通过</h2>
      <div class="okbox">${esc(r.verify_message||'')}</div>
      <div style="font-size:12.5px;color:var(--muted);margin:10px 0">
        操作编号 <code>${esc(r.op_id)}</code><br>
        已移动 ${r.staged_count ?? 0} 项到隔离区${r.permanent?'（已永久删除）':'，可在「操作记录」中还原'}。</div>
      <div class="actions-list">${(r.steps||[]).map(s=>
        `<div><span class="k">${esc(s.action||'')}</span><span>${esc(s.path||s.table||'')}
        ${s.result?` · ${esc(s.result)}`:''}${s.deleted!=null?` · ${s.deleted} 行`:''}</span></div>`).join('')}</div>
      <div class="row"><button class="act" onclick="afterDelete()">完成</button></div>`);
  }
  await loadSessions();
};

window.afterDelete = async () => {
  closeModal();
  delete STATE.scores;
  await loadSessions();
  if(STATE.view==="sessions") renderSessions();
  await loadOverview();
  if(STATE.view==="cleanup") renderCleanup();
  if(STATE.view==="history") renderHistory();
};

window.refreshAll = async () => {
  delete STATE.scores;
  await loadOverview(); await loadSessions(); renderSessions();
  if(STATE.view==="cleanup") renderCleanup();
};

/* ---------------------------------------------------------- bulk delete */
function picked(){
  return [...document.querySelectorAll(".pick:checked")].map(c => ({
    agent: c.dataset.agent, sid: c.dataset.sid
  }));
}

function updatePickBar(){
  const n = document.querySelectorAll(".pick:checked").length;
  const bar = $("#batchBar");
  if(!bar) return;
  $("#pickCnt").textContent = `已选择 ${n} 项`;
  bar.style.display = n ? "" : "none";
  const all = document.querySelectorAll(".pick").length;
  const pa = $("#pickAll");
  if(pa) pa.checked = all > 0 && n === all;
}

window.clearPicks = () => {
  document.querySelectorAll(".pick").forEach(c => { c.checked = false; });
  updatePickBar();
};

window.batchDelete = () => {
  const items = picked();
  if(!items.length) return;
  const byAgent = {};
  items.forEach(i => { byAgent[i.agent] = (byAgent[i.agent]||0)+1; });
  const summary = Object.entries(byAgent).map(([k,v])=>`${k}: ${v}`).join('，');
  const pinnedCount = items.filter(i => {
    const s = (STATE.sessions||[]).find(x => x.agent===i.agent && x.sid===i.sid);
    return s && s.protected;
  }).length;
  modal(`<h2>批量删除 ${items.length} 个会话</h2>
    <div class="sub">${esc(summary)}</div>
    ${pinnedCount?`<div class="warnbox"><b>其中 ${pinnedCount} 个已标记「保留」</b>，
      默认会被跳过。如需一并删除，请勾选下面的「忽略保留标记」。</div>`:''}
    <div class="warnbox">每个会话都会先经过独立的<b>安全检查与删除后校验</b>；
      被阻止的（例如 Agent 正在运行、会话正在使用）会被单独跳过，不会影响其他项。
      全部数据默认进入隔离区，可逐一还原。</div>
    <div class="actions-list">${items.map(i=>{
      const s = (STATE.sessions||[]).find(x => x.agent===i.agent && x.sid===i.sid);
      return `<div><span class="k">${esc(i.agent)}</span><span class="mono">${esc(i.sid)}</span>
        ${s&&s.protected?'<span class="tag" style="color:var(--warn)">保留</span>':''}</div>`;
    }).join('')}</div>
    <label class="chk"><input type="checkbox" id="bPerm">
      永久删除（<b>不进隔离区，无法还原</b>）</label>
    ${pinnedCount?`<label class="chk"><input type="checkbox" id="bIgnorePin">
      忽略保留标记（<b>仅本次</b>，不会取消标记）</label>`:''}
    <div class="row">
      <button class="act ghostbtn" onclick="closeModal()">取消</button>
      <button class="act" id="batchGo" onclick="runBatch()">确认删除 ${items.length} 项</button>
    </div>`);
};

window.runBatch = async () => {
  const items = picked();
  const perm = $("#bPerm")?.checked || false;
  const ignorePin = $("#bIgnorePin")?.checked || false;
  if(perm && !confirm("永久删除无法还原，确定继续？")) return;
  const btn = $("#batchGo");
  btn.disabled = true;
  btn.innerHTML = `<span class="spin"></span> 正在删除 ${items.length} 项…`;
  let r;
  try {
    r = await api("/api/batch-delete", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({items, permanent:perm, allow_unpin:ignorePin})
    });
  } catch(e){ r = {ok:false, error:e.message}; }

  if(!r.ok){
    modal(`<h2>批量删除失败</h2><div class="errbox">${esc(r.error||'')}</div>
      <div class="row"><button class="act ghostbtn" onclick="closeModal()">关闭</button></div>`);
  } else {
    const failed = r.results.filter(x=>!x.ok);
    modal(`<h2>批量删除完成</h2>
      <div class="okbox">成功 ${r.deleted} 项${r.failed?`，跳过/失败 ${r.failed} 项`:''}。</div>
      ${failed.length?`<div class="warnbox"><b>以下项目未删除：</b><br>${
        failed.map(f=>`<span class="mono">${esc(f.sid)}</span> — ${esc(f.error)}`).join('<br>')
      }</div>`:''}
      <div class="row"><button class="act" onclick="afterDelete()">完成</button></div>`);
  }
  await loadSessions();
};

async function runSearch(){
  const q = $("#sq").value.trim();
  const sAgent = $("#sAgent");
  const agent = sAgent ? sAgent.value : "";
  const regex = $("#sRegex").checked, cs = $("#sCase").checked;
  if(!q){ $("#sResults").innerHTML=""; $("#sInfo").textContent=""; return; }
  $("#sInfo").textContent = "搜索中…";
  $("#sResults").innerHTML = `<div class="empty"><span class="spin"></span> 正在检索…</div>`;
  let r;
  try {
    r = await api(`/api/search?q=${encodeURIComponent(q)}&agent=${encodeURIComponent(agent)}`
      + `&regex=${regex?1:0}&case=${cs?1:0}`);
  } catch(e){
    $("#sResults").innerHTML = `<div class="errbox">${esc(e.message)}</div>`;
    $("#sInfo").textContent = "";
    return;
  }
  if(!r.ok){ $("#sResults").innerHTML=`<div class="errbox">${esc(r.error||"")} ${esc(r.detail||"")}</div>`; return; }
  if(r.error){ $("#sResults").innerHTML=`<div class="errbox">${esc(r.error)}</div>`; $("#sInfo").textContent=""; return; }

  $("#sInfo").textContent = `${r.total_matches} 处匹配 · ${r.results.length} 个会话 · ${r.elapsed_ms} ms`;
  if(!r.results.length){
    $("#sResults").innerHTML = `<div class="empty">没有找到匹配内容。
      ${r.unsearchable_sessions?`<br><span style="font-size:12px">（另有 ${r.unsearchable_sessions} 个会话没有可搜索的正文）</span>`:''}</div>`;
    return;
  }
  let h = "";
  for(const res of r.results){
    const tags=[];
    if(res.is_ghost) tags.push(`<span class="tag ghost">幽灵</span>`);
    if(res.is_orphan) tags.push(`<span class="tag orphan">孤儿</span>`);
    if(res.pinned) tags.push(`<span class="tag" style="color:var(--warn);border-color:#5c4620">保留</span>`);
    h += `<div class="card" style="margin-bottom:12px">
      <h3 style="font-size:14px;cursor:pointer"
          onclick="previewSession('${esc(res.agent)}','${esc(res.sid)}')">
        ${esc(res.title||'(无标题)')}
        <span class="badge">${res.match_count} 处</span>${tags.join("")}</h3>
      <div class="path">${esc(res.agent_label)} · <span class="mono">${esc(res.sid)}</span>
        ${res.updated_iso?` · ${esc(res.updated_iso)}`:''}</div>
      <div style="margin-top:8px">`;
    for(const m of res.matches){
      const who = {user:"用户",assistant:"助手",tool:"工具",system:"系统"}[m.role] || m.role;
      h += `<div style="font-size:12px;padding:6px 9px;margin-bottom:4px;background:var(--bg);
              border:1px solid var(--line);border-radius:6px">
        <span class="tag">${esc(who)}${m.kind?`·${esc(m.kind)}`:''}</span>
        <span class="mono" style="color:var(--muted)">${esc(m.snippet)}</span></div>`;
    }
    h += `</div>
      <div style="margin-top:8px">
        <button class="act ghostbtn" onclick="previewSession('${esc(res.agent)}','${esc(res.sid)}')">查看会话</button>
        <button class="act ghostbtn" onclick="togglePin('${esc(res.agent)}','${esc(res.sid)}')">
          ${res.pinned?'取消保留':'标记保留'}</button>
        <button class="act" onclick="planDelete('${esc(res.agent)}','${esc(res.sid)}')">删除…</button>
      </div></div>`;
  }
  $("#sResults").innerHTML = h;
}

      <thead><tr><th>Agent</th><th>标题</th><th class="num">输入</th><th class="num">输出</th>

/* -------------------------------------------------------------- cleanup */
async function renderCleanup(){
  $("#view-cleanup").innerHTML = `<div class="empty"><span class="spin"></span> 正在检查…</div>`;

  const days = STATE.retDays ?? 30;
  const rules = STATE.retRules ?? ["ghost","orphan","blank","old"];
  let ret = null, health = null;
  try {
    ret = await api(`/api/retention?days=${days}&rules=${encodeURIComponent(rules.join(","))}`
      + `&max_kb=${STATE.retMaxKb ?? 20}&min_mb=${STATE.retMinMb ?? 5}`);
  } catch(e){ ret = {ok:false, error:e.message}; }
  try { health = await api("/api/health"); } catch(e){ health = {ok:false, error:e.message}; }

  const allRules = (ret && ret.rule_catalog) ? Object.keys(ret.rule_catalog) : [];
  let h = `<p style="color:var(--muted);font-size:13px">
    这些是本工具发现的残留与可疑项。<b>全部只做建议，不会自动删除</b>；
    请在「会话」页确认后再操作。</p>`;

  h += `<div class="card" style="margin-bottom:16px">
    <h3 style="font-size:14px">保留规则筛选</h3>
    <div class="toolbar" style="margin:10px 0 6px">
      ${allRules.map(r=>{
        const cat = (ret.rule_catalog||{})[r] || {};
        const on = rules.includes(r);
        return `<label class="chk"><input type="checkbox" class="rtRule" value="${esc(r)}"
          ${on?'checked':''}> ${esc(cat.label||r)}</label>`;
      }).join('')}
    </div>
    <div class="toolbar">
      <label class="chk">超过 <input type="number" id="rtDays" value="${days}" min="0"
        style="width:70px;background:var(--panel);border:1px solid var(--line);
        color:var(--fg);border-radius:6px;padding:4px 7px"> 天未活动</label>
      <button class="act" id="rtGo">应用规则</button>
      ${ret && ret.ok ? `<span class="badge warn">${ret.proposal_count} 个建议
        · 可回收 ${hsize(ret.proposal_bytes)}</span>
        ${ret.skipped_count?`<span class="badge">已跳过 ${ret.skipped_count} 个保留项</span>`:''}`:''}
    </div>
    <p class="path" style="margin:8px 0 0">规则只筛选，不执行。勾选后的结果如下。</p>
  </div>`;

  if(ret && ret.ok && ret.proposals.length){
    h += `<div class="card" style="padding:0;overflow:hidden;margin-bottom:16px"><table>
      <thead><tr><th style="width:34px"></th><th>Agent</th><th>标题</th>
        <th class="num">体积</th><th>最后活动</th><th>匹配原因</th>
        <th style="width:180px"></th></tr></thead><tbody>`;
    for(const p of ret.proposals){
      h += `<tr>
        <td><input type="checkbox" class="rtPick" data-agent="${esc(p.agent)}"
             data-sid="${esc(p.sid)}"></td>
        <td class="mono">${esc(p.agent)}</td>
        <td><div class="title clickable" onclick="previewSession('${esc(p.agent)}','${esc(p.sid)}')">
            ${esc(p.title||'(无标题)')}</div>
          ${p.is_ghost?'<span class="tag ghost">幽灵</span>':''}
          ${p.is_orphan?'<span class="tag orphan">孤儿</span>':''}</td>
        <td class="num">${hsize(p.size)}</td>
        <td class="mono" style="font-size:11.5px">${esc(p.updated_iso||'')}</td>
        <td style="font-size:11.5px;color:var(--muted)">${p.reasons.map(esc).join('<br>')}</td>
        <td style="white-space:nowrap">
          <button class="act ghostbtn" onclick="previewSession('${esc(p.agent)}','${esc(p.sid)}')">查看</button>
          <button class="act" onclick="planDelete('${esc(p.agent)}','${esc(p.sid)}')">删除…</button></td>
      </tr>`;
    }
    h += `</tbody></table></div>
      <div class="toolbar">
        <button class="act" onclick="retentionBatchDelete()">批量删除选中项…</button>
        <button class="act ghostbtn" onclick="retentionSelectAll()">全选</button>
        <button class="act ghostbtn" onclick="retentionSelectNone()">取消选择</button>
      </div>`;
  } else if(ret && ret.ok){
    h += `<div class="empty">当前规则下没有需要清理的会话。</div>`;
  } else if(ret && ret.error){
    h += `<div class="errbox">${esc(ret.error)}</div>`;
  }

  const f = (health && health.findings) || [];
  if(f.length){
    h += `<h3 style="margin-top:22px">结构性问题</h3>`;
    for(const x of f){
      h += `<div class="finding ${x.level==='warn'?'warn':''}">
        <b>${esc(x.title)}</b> <span class="tag">${esc(x.agent)}</span>
        ${x.size?`<span class="badge">${hsize(x.size)}</span>`:''}
        <p>${esc(x.detail)}</p>
        ${x.action?`<p>→ ${esc(x.action)}</p>`:''}
        ${(x.items||[]).length?`<p class="mono" style="color:var(--muted);max-height:110px;overflow:auto">
          ${x.items.slice(0,40).map(esc).join('<br>')}
          ${x.items.length>40?`<br>… 另有 ${x.items.length-40} 项`:''}</p>`:''}
      </div>`;
    }
  }
  $("#view-cleanup").innerHTML = h;

  const go = $("#rtGo");
  if(go) go.onclick = () => {
    STATE.retRules = [...document.querySelectorAll(".rtRule:checked")].map(c=>c.value);
    STATE.retDays = parseInt($("#rtDays").value || "30", 10);
    renderCleanup();
  };
}

window.retentionSelectAll = () => {
  document.querySelectorAll(".rtPick").forEach(c => { c.checked = true; });
};
window.retentionSelectNone = () => {
  document.querySelectorAll(".rtPick").forEach(c => { c.checked = false; });
};
window.retentionBatchDelete = () => {
  const items = [...document.querySelectorAll(".rtPick:checked")].map(c => ({
    agent: c.dataset.agent, sid: c.dataset.sid
  }));
  if(!items.length){ alert("请先勾选要删除的会话。"); return; }
  modal(`<h2>批量删除 ${items.length} 个会话</h2>
    <div class="warnbox">每个会话都会经过独立的<b>安全检查与删除后校验</b>；
      被阻止的（Agent 正在运行、会话正在使用、已标记保留）会被单独跳过。
      数据默认进入隔离区，可逐一还原。</div>
    <div class="actions-list">${items.map(i=>
      `<div><span class="k">${esc(i.agent)}</span><span class="mono">${esc(i.sid)}</span></div>`
    ).join('')}</div>
    <div class="row">
      <button class="act ghostbtn" onclick="closeModal()">取消</button>
      <button class="act" id="rbGo" onclick="runRetentionBatch()">确认删除 ${items.length} 项</button>
    </div>`);
};
window.runRetentionBatch = async () => {
  const items = [...document.querySelectorAll(".rtPick:checked")].map(c => ({
    agent: c.dataset.agent, sid: c.dataset.sid
  }));
  const btn = $("#rbGo");
  btn.disabled = true; btn.innerHTML = `<span class="spin"></span> 正在删除…`;
  let r;
  try {
    r = await api("/api/batch-delete", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({items})
    });
  } catch(e){ r = {ok:false, error:e.message}; }
  if(!r.ok){
    modal(`<h2>批量删除失败</h2><div class="errbox">${esc(r.error||'')}</div>
      <div class="row"><button class="act ghostbtn" onclick="closeModal()">关闭</button></div>`);
  } else {
    const failed = r.results.filter(x=>!x.ok);
    modal(`<h2>批量删除完成</h2>
      <div class="okbox">成功 ${r.deleted} 项${r.failed?`，跳过/失败 ${r.failed} 项`:''}。</div>
      ${failed.length?`<div class="warnbox"><b>以下项目未删除：</b><br>${
        failed.map(f=>`<span class="mono">${esc(f.sid)}</span> — ${esc(f.error)}`).join('<br>')
      }</div>`:''}
      <div class="row"><button class="act" onclick="closeModal();afterDelete()">完成</button></div>`);
  }
  await loadSessions();
};

window.openUninstall = async (agent) => {
  U.agent = agent; U.stage = 1; U.pf = null; U.plan = null;
  const box = $("#uDetail");
  box.innerHTML = `<div class="empty"><span class="spin"></span> 正在预检 ${esc(agent)}…</div>`;
  box.scrollIntoView({behavior:"smooth", block:"start"});
  let pf;
  try { pf = await api("/api/uninstall/preflight?agent="+encodeURIComponent(agent)); }
  catch(e){ box.innerHTML = `<div class="errbox">${esc(e.message)}</div>`; return; }
  if(!pf.ok){ box.innerHTML = `<div class="errbox">${esc(pf.error||"")}</div>`; return; }
  U.pf = pf;
  drawPreflight();
};

function uStages(){
  const names = ["预检","调用卸载器","卸载后验证","清理残留","生成报告"];
  return `<div class="card" style="display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px">` +
    names.map((n,i) => {
      const s = i+1;
      const cur = s===U.stage, done = s<U.stage;
      return `<span class="badge" style="${cur?'color:var(--fg);font-weight:600':
        done?'color:var(--ok)':'color:var(--muted)'}">${done?'✓ ':''}${s}. ${n}</span>`;
    }).join("") + `</div>`;
}

function drawPreflight(){
  const pf = U.pf, box = $("#uDetail");
  const u = pf.uninstall || {};
  const w = pf.windows || {};
  const s = (pf.residue&&pf.residue.summary) || {};
  let h = `<div style="margin:14px 0 8px">${uStages()}</div>
    <h3>${esc(pf.label)} — 卸载预检</h3>`;

  if((pf.blockers||[]).length){
    h += pf.blockers.map(b =>
      `<div class="warnbox"><b>⚠ ${esc(b.title)}</b><br>${esc(b.detail||"")}
       ${b.action?`<br>→ ${esc(b.action)}`:""}</div>`).join("");
  } else {
    h += `<div class="okbox">预检通过，未发现阻碍项。</div>`;
  }

  h += `<div class="card">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div><b>官方卸载器</b>
        <div class="sub">${u.registry_name?esc(u.registry_name)+(u.version?' '+esc(u.version):''):'注册表中未找到卸载条目'}</div></div>
      <div style="text-align:right"><span class="badge">${u.silent?'支持静默参数':'需图形界面'}</span></div>
    </div>
    ${u.command?`<div class="mono" style="margin-top:8px;font-size:12px;word-break:break-all">${esc(u.command)}</div>
      <div class="sub" style="margin-top:4px">${esc(u.note||"")}</div>`
      :`<div class="sub" style="margin-top:8px">${esc(u.note||"请从「设置 → 应用」中卸载。")}</div>`}
    <div class="sub" style="margin-top:8px">
      会话 ${pf.sessions.count} 个（受保护 ${pf.sessions.pinned} 个） ·
      可安全回收 ${esc(s.safe_bytes_h||"0 B")} · 需确认 ${esc(s.review_bytes_h||"0 B")}
      ${w.needs_admin?` · <span style="color:var(--warn)">部分项目需要管理员权限${pf.elevated?'（当前已提权）':'（当前未提权）'}</span>`:""}
    </div>
  </div>`;

  if((pf.credentials||[]).length){
    h += `<div class="warnbox"><b>检测到 ${pf.credentials.length} 个密钥/凭据文件</b>，
      卸载后仍会留在磁盘上：</div>
      <div class="card" style="padding:0;overflow:hidden"><table style="width:100%">` +
      pf.credentials.slice(0,20).map(c =>
        `<tr><td class="mono" style="font-size:12px">${esc(c.path)}</td>
         <td class="num">${esc(c.size_h||"")}</td></tr>`).join("") +
      `</table></div>`;
  }
  if((pf.temp||[]).length){
    h += `<div class="sub" style="margin:8px 0">%TEMP% 临时目录 ${pf.temp.length} 个，共 ${esc((pf.temp||[]).reduce((n,t)=>n+(t.size||0),0)>0?"":"0 B")}</div>`;
  }

  h += `<div class="row" style="margin-top:12px">
      <button class="act ghostbtn" onclick="openUninstall('${esc(U.agent)}')">重新预检</button>
      <button class="act" onclick="gotoVerify()">下一步：卸载后验证</button>
      <button class="act" onclick="gotoPlan()" ${U.pf.installed?'':'disabled'}>查看清理方案</button>
    </div>
    <div id="uNext"></div>`;
  box.innerHTML = h;
}

window.gotoVerify = async () => {
  U.stage = 3;
  const box = $("#uNext");
  box.innerHTML = `<div class="empty"><span class="spin"></span> 正在重新扫描…</div>`;
  let v;
  try { v = await api("/api/uninstall/verify?agent="+encodeURIComponent(U.agent)); }
  catch(e){ box.innerHTML = `<div class="errbox">${esc(e.message)}</div>`; return; }
  if(!v.ok){ box.innerHTML = `<div class="errbox">${esc(v.error||"")}</div>`; return; }
  box.innerHTML = `<h3>卸载后验证</h3>
    <div class="${v.remaining_items? 'warnbox':'okbox'}">
      ${v.remaining_items
        ? `仍有 <b>${v.remaining_items}</b> 项残留（${esc(v.remaining_bytes_h)}），可继续清理。`
        : `<b>已清理干净。</b>`}
      <div class="sub">${esc(v.note||"")}</div>
    </div>
    <div class="card"><table style="width:100%">
      <tr><td>仍然安装</td><td>${v.still_installed?'是':'否'}</td></tr>
      <tr><td>注册表卸载条目</td><td>${v.uninstall_entry_present?'仍在':'已清除'}</td></tr>
      <tr><td>仍可回收</td><td class="num">${esc(v.reclaimable_bytes_h)}</td></tr>
      <tr><td>密钥残留</td><td class="num">${v.credentials_left}</td></tr>
      <tr><td>需要管理员</td><td>${v.needs_admin?'是':'否'}</td></tr>
    </table></div>
    <div class="row" style="margin-top:10px">
      <button class="act" onclick="gotoPlan()">下一步：清理残留</button>
      <button class="act ghostbtn" onclick="openUninstall('${esc(U.agent)}')">返回预检</button>
    </div>`;
};

window.gotoPlan = async () => {
  U.stage = 4;
  const box = $("#uNext");
  box.innerHTML = `<div class="empty"><span class="spin"></span> 正在分析残留…</div>`;
  let p;
  try { p = await api("/api/uninstall/plan?agent="+encodeURIComponent(U.agent)); }
  catch(e){ box.innerHTML = `<div class="errbox">${esc(e.message)}</div>`; return; }
  if(!p.ok){ box.innerHTML = `<div class="errbox">${esc(p.error||"")}</div>`; return; }
  U.plan = p;
  box.innerHTML = `<h3>清理方案</h3><div class="sub" style="margin:0 0 10px">${esc(p.note||"")}</div>
    ${uPlanPanel()}`;
};

function uPlanPanel(){
  const p = U.plan;
  const row = (it, checked) => {
    const kind = it.kind ? `[${esc(it.kind)}] ` : "";
    const lock = it.needs_admin ? ` <span class="badge" style="color:var(--warn)">需管理员</span>` : "";
    return `<tr>
      <td style="width:30px">${it.needs_admin?'<span title="需要管理员权限" style="color:var(--muted)">🔒</span>'
        :`<input type="checkbox" class="uPick" data-path="${esc(it.path)}" ${checked?"checked":""}>`}</td>
      <td><div class="mono" style="font-size:12px;word-break:break-all">${kind}${esc(it.path)}</div>
        <div class="sub">${esc(it.evidence||"")}</div></td>
      <td class="num">${esc(it.size_h||"—")}</td>
      <td>${esc(it.category_label||it.category||"")}</td>
    </tr>`;
  };
  const group = (title, items, checked, muted) => items.length ? `
    <details open><summary><b>${esc(title)}</b> — ${items.length} 项
      <span style="color:var(--muted);font-size:12px">
        ${muted?'（列出原因，不会删除）':'（勾选后清理）'}</span></summary>
      <div class="card" style="padding:0;overflow:hidden;max-height:340px;overflow-y:auto">
      <table style="width:100%">${items.map(i=>row(i,checked)).join("")}</table></div>
    </details>` : "";
  return group("可安全清理", p.safe, true, false)
       + group("需人工确认", p.review, false, false)
       + group("禁止删除", p.never, false, true)
    + `<div class="row" style="margin-top:12px;align-items:center">
        <button class="act ghostbtn" onclick="runCleanup(true)">预演</button>
        <button class="act" onclick="runCleanup(false)">清理选中项</button>
        <label class="chk"><input type="checkbox" id="uPerm">
          永久删除（不进隔离区，无法还原）</label>
        <label class="chk"><input type="checkbox" id="uRoots">
          包含数据根目录（不可逆，需谨慎）</label>
      </div>
      <div id="uRun"></div>`;
}

window.runCleanup = async (dry) => {
  const picks = [...document.querySelectorAll(".uPick:checked")].map(c=>c.dataset.path);
  const box = $("#uRun");
  if(!picks.length){ box.innerHTML = `<div class="warnbox">没有勾选任何项目。</div>`; return; }
  if(!dry && !confirm(`将清理 ${picks.length} 项（默认进入隔离区，可还原）。继续？`)) return;
  box.innerHTML = `<div class="empty"><span class="spin"></span> ${dry?"预演中…":"正在清理…"}</div>`;
  const perm = $("#uPerm") && $("#uPerm").checked;
  const roots = $("#uRoots") && $("#uRoots").checked;
  let r;
  try {
    r = await api("/api/cleanup", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({agent:U.agent, paths:picks, dry_run:!!dry,
                            permanent:perm && !dry, include_data_roots:roots})});
  } catch(e){ box.innerHTML = `<div class="errbox">${esc(e.message)}</div>`; return; }
  if(!r.ok){ box.innerHTML = `<div class="errbox">${esc(r.error||"")}${r.detail?`<br>${esc(r.detail)}`:""}</div>`; return; }

  const fo = r.file_ops || {};
  if(dry){
    box.innerHTML = `<div class="okbox"><b>预演完成，未修改任何文件。</b>
      <div class="sub">${esc(r.note||"")}</div></div>` + uResultList(fo);
    return;
  }
  box.innerHTML = `<div class="${r.files&&r.files.removed?'okbox':'warnbox'}">
      ${esc(r.note||"")}</div>` + uResultList(fo)
    + (r.needs_admin&&r.needs_admin.length ? `<div class="warnbox"><b>以下项目需要管理员权限，请自行执行：</b><br>`
      + r.needs_admin.map(c=>`<span class="mono" style="font-size:12px">${esc(c.command)}</span>`).join("<br>") + `</div>` : "")
    + `<div class="row" style="margin-top:10px">
        <button class="act" onclick="gotoVerify()">重新验证残留</button></div>`;
};

function uResultList(fo){
  const res = fo.results || [];
  if(!res.length) return "";
  return `<div class="card" style="padding:0;overflow:hidden;max-height:320px;overflow-y:auto">
    <table style="width:100%">` + res.map(x =>
      `<tr><td style="width:24px">${x.ok?'<span style="color:var(--ok)">✓</span>':
        `<span style="color:var(--danger)">✗</span>`}</td>
       <td class="mono" style="font-size:12px;word-break:break-all">${esc(x.path)}</td>
       <td style="color:var(--muted);font-size:12px">${x.ok?'':esc(x.error||"")}</td></tr>`).join("")
    + `</table></div>`;
}

/* -------------------------------------------------------------- history */
async function renderHistory(){
  $("#view-history").innerHTML = `<div class="empty"><span class="spin"></span> 正在读取…</div>`;
  const r = await api("/api/operations");
  const ops = r.operations || [];
  if(!ops.length){
    $("#view-history").innerHTML = `<div class="empty">还没有执行过任何删除操作。</div>`;
    return;
  }
  let h = `<div class="card" style="padding:0;overflow:hidden"><table>
    <thead><tr><th>时间</th><th>Agent</th><th>会话</th><th>状态</th>
      <th class="num">隔离区</th><th style="width:110px"></th></tr></thead><tbody>`;
  for(const o of ops){
    const st = o.status==="completed"
      ? `<span class="badge ok">已删除</span>`
      : `<span class="badge warn">${esc(o.status)}</span>`;
    h += `<tr>
      <td class="mono" style="font-size:11.5px">${esc(new Date(o.time).toLocaleString())}</td>
      <td class="mono">${esc(o.agent)}</td>
      <td><div class="title">${esc(o.title||o.sid)}</div>
          ${o.was_restored?`<span class="tag">已还原过</span>`:''}
          ${o.permanent?`<span class="tag locked">永久删除</span>`:''}</td>
      <td>${st}</td>
      <td class="num">${esc(o.quarantine_size_h)}</td>
      <td>${o.restorable
        ? `<button class="act" onclick="doRestore('${esc(o.op_id)}')">还原</button>`
        : `<span class="badge">已清理</span>`}</td>
    </tr>`;
  }
  h += `</tbody></table></div>`;
  $("#view-history").innerHTML = h;
}

window.doRestore = async (opId) => {
  if(!confirm("将把该会话的数据恢复到原位置，继续？")) return;
  const r = await api("/api/restore", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({op_id:opId})
  });
  if(r.ok){
    modal(`<h2>已还原</h2><div class="okbox">恢复 ${r.restored} 项。</div>
      <div class="row"><button class="act" onclick="closeModal();afterDelete()">完成</button></div>`);
  } else {
    modal(`<h2>还原未完全成功</h2><div class="errbox">${esc(r.error||'')}
      ${(r.errors||[]).length?`<br><br>${r.errors.map(esc).join('<br>')}`:''}</div>
      <div class="row"><button class="act ghostbtn" onclick="closeModal()">关闭</button></div>`);
  }
};

/* ----------------------------------------------------------------- boot */
(async function(){
  await loadOverview();
  await loadSessions();
})();
</script>
</body>
